# Isolated env for ComfyUI-HYPano2 nodes.
#
# Why isolation? The upstream `PanoDiffusionPipeline` subclasses
# `diffusers.pipelines.qwenimage.pipeline_qwenimage_edit_plus.QwenImageEditPlusPipeline`
# and imports private symbols from that module (`calculate_shift`,
# `retrieve_timesteps`, `calculate_dimensions`). Minor-version drift in
# diffusers breaks the import — so we hard-pin diffusers==0.36.0 and
# its transformers/tokenizers/safetensors/numpy cohort. The host
# ComfyUI env is free to evolve independently.

[dependencies]
av = "*"

[cuda]
# flash_attn drives diffusers' transformer.set_attention_backend("flash"),
# picked up at runtime when ComfyUI was launched with --use-flash-attention.
# sageattention v2.2.0 is intentionally NOT included — its wheel has a
# circular import (sageattention/quant.py:20 imports `_fused` before
# sageattention/__init__.py finishes loading), which diffusers' eager
# attention_dispatch.py probe surfaces as a fatal ImportError. Revisit
# once that ships fixed.
packages = ["flash_attn"]

[pypi-dependencies]
# Hard pins from upstream `repo/hyworld2/panogen/requirements.txt`.
# Reaching into diffusers' private qwenimage submodule means we cannot
# float these.
diffusers = "==0.36.0"
transformers = { version = "==4.57.1", extras = ["accelerate", "tiktoken"] }
tokenizers = "==0.22.0"
safetensors = "==0.7.0"
einops = "==0.8.1"
# Upstream pins ==2.2.0, but the conda solve grabs 2.4.x. Numpy 2.x is
# ABI-stable, so >=2.2,<3 keeps us on a 2.x line without fighting the
# conda solver.
numpy = ">=2.2,<3"
huggingface_hub = { version = "*", extras = ["cli"] }
loguru = ">=0.7.3"
pillow = "*"
comfy-aimdo = "*"
scipy = "*"
# diffusers.load_lora_weights routes through PEFT for transformer LoRAs
# (the HY-Pano-2 weights target the Qwen-Image-Edit transformer).
peft = ">=0.13"
