# Isolated env for ComfyUI-HYPano2 nodes.
#
# Why isolation? The upstream `PanoDiffusionPipeline` subclasses
# `diffusers.pipelines.qwenimage.pipeline_qwenimage_edit_plus.QwenImageEditPlusPipeline`
# and imports private symbols from that module (`calculate_shift`,
# `retrieve_timesteps`, `calculate_dimensions`). Minor-version drift in
# diffusers breaks the import — so we hard-pin diffusers==0.36.0 and
# its transformers/tokenizers/safetensors/numpy cohort. The host
# ComfyUI env is free to evolve independently.

[dependencies]
av = "*"

[cuda]
# No CUDA-compiled extensions required for the Qwen-Image-Edit backend.
# SDPA is fine; flash_attn is only needed by the (out-of-scope)
# HunyuanImage-3 backend.
packages = []

[pypi-dependencies]
# Hard pins from upstream `repo/hyworld2/panogen/requirements.txt`.
# Reaching into diffusers' private qwenimage submodule means we cannot
# float these.
diffusers = "==0.36.0"
transformers = { version = "==4.57.1", extras = ["accelerate", "tiktoken"] }
tokenizers = "==0.22.0"
safetensors = "==0.7.0"
einops = "==0.8.1"
numpy = "==2.2.0"
huggingface_hub = { version = "*", extras = ["cli"] }
loguru = ">=0.7.3"
pillow = "*"
